
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080A0D">
  <title>ONE TAP TRADE</title>
  <link rel="stylesheet" href="/style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <main class="shell">
    <header class="top">
      <div class="telegram-brand">
        <span>TELEGRAM</span>
        <span class="check">✓</span>
      </div>
      <div class="app-name">ONE TAP TRADE</div>

      <div class="language-switch">
        <button type="button" id="langRU" class="active">RU</button>
        <button type="button" id="langEN">EN</button>
      </div>

      <p class="sub" data-i18n="subtitle">Обмен цифровыми коллекционными предметами</p>
    </header>

    <section class="panel intro">
      <div class="eyebrow">STAGE 01</div>
      <h1 data-i18n="heading">Создание обмена</h1>
      <p data-i18n="description">Укажи участников и добавь ссылки на два NFT для предварительного просмотра.</p>
    </section>

    <section class="cards">
      <article class="nft-card">
        <div class="card-head">
          <span class="number">01</span>
          <span class="tag" data-i18n="yourNft">ТВОЙ NFT</span>
        </div>

        <label for="username1" data-i18n="yourUsername">Твой Telegram username</label>
        <input id="username1" type="text" placeholder="@your_username">

        <label for="link1" data-i18n="yourLink">Ссылка на твой NFT</label>
        <input id="link1" type="url" placeholder="https://t.me/nft/BDayCandle-202879">

        <div class="preview" id="preview1">
          <div class="placeholder" data-i18n="preview">ПРЕДПРОСМОТР NFT</div>
        </div>
        <div class="status" id="status1"></div>
      </article>

      <article class="nft-card">
        <div class="card-head">
          <span class="number">02</span>
          <span class="tag" data-i18n="partnerNft">NFT ПАРТНЁРА</span>
        </div>

        <label for="username2" data-i18n="partnerUsername">Telegram username партнёра</label>
        <input id="username2" type="text" placeholder="@partner_username">

        <label for="link2" data-i18n="partnerLink">Ссылка на NFT партнёра</label>
        <input id="link2" type="url" placeholder="https://t.me/nft/ViceCream-313219">

        <div class="preview" id="preview2">
          <div class="placeholder" data-i18n="preview">ПРЕДПРОСМОТР NFT</div>
        </div>
        <div class="status" id="status2"></div>
      </article>
    </section>

    <button id="checkBtn" class="primary" type="button" data-i18n="load">
      ЗАГРУЗИТЬ NFT
    </button>

    <p id="globalStatus" class="global-status" role="status"></p>

    <footer data-i18n="footer">
      ONE TAP TRADE · NFT PREVIEW
    </footer>
  </main>

  <script>
    const translations = {
      ru: {
        subtitle: "Обмен цифровыми коллекционными предметами",
        heading: "Создание обмена",
        description: "Укажи участников и добавь ссылки на два NFT для предварительного просмотра.",
        yourNft: "ТВОЙ NFT",
        partnerNft: "NFT ПАРТНЁРА",
        yourUsername: "Твой Telegram username",
        partnerUsername: "Telegram username партнёра",
        yourLink: "Ссылка на твой NFT",
        partnerLink: "Ссылка на NFT партнёра",
        preview: "ПРЕДПРОСМОТР NFT",
        load: "ЗАГРУЗИТЬ NFT",
        footer: "ONE TAP TRADE · ПРЕДПРОСМОТР NFT"
      },
      en: {
        subtitle: "Digital collectible exchange",
        heading: "Create an exchange",
        description: "Enter both participants and add two NFT links to preview.",
        yourNft: "YOUR NFT",
        partnerNft: "PARTNER'S NFT",
        yourUsername: "Your Telegram username",
        partnerUsername: "Partner's Telegram username",
        yourLink: "Your NFT link",
        partnerLink: "Partner's NFT link",
        preview: "NFT PREVIEW",
        load: "LOAD NFTS",
        footer: "ONE TAP TRADE · NFT PREVIEW"
      }
    };

    function setLanguage(lang) {
      const selected = translations[lang] ? lang : "ru";
      document.documentElement.lang = selected;

      document.querySelectorAll("[data-i18n]").forEach(element => {
        const key = element.dataset.i18n;
        element.textContent = translations[selected][key];
      });

      document.getElementById("langRU").classList.toggle("active", selected === "ru");
      document.getElementById("langEN").classList.toggle("active", selected === "en");

      localStorage.setItem("ott-language", selected);
    }

    document.getElementById("langRU").addEventListener("click", () => setLanguage("ru"));
    document.getElementById("langEN").addEventListener("click", () => setLanguage("en"));

    setLanguage(localStorage.getItem("ott-language") || "ru");
  </script>

  <script src="/app.js"></script>
  <script>
    if (window.Telegram?.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }
  </script>
</body>
</html>
