<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0c10">
<title>One Tap Trade</title>
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#0a0c10;--bg2:#10131a;--card:#141821;--card2:#1a1f2b;
  --line:#252b3a;--text:#eef1f7;--muted:#8b93a7;
  --accent:#2fd67b;--accent2:#1fb866;--ink:#04210f;--tg:#2a9df4;
  --danger:#ff5d6c;--warn:#ffb020;
  --pad:clamp(14px,4.6vw,22px);
  --app-h:100vh;
}
@supports (height:100dvh){:root{--app-h:100dvh}}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden}
body{
  background:
    radial-gradient(900px 520px at 50% -8%,rgba(47,214,123,.14) 0%,rgba(47,214,123,0) 62%),
    var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Inter","SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  min-height:var(--app-h);
  -webkit-font-smoothing:antialiased;
}
button,input{font-family:inherit}

.app{
  min-height:var(--app-h);
  width:100%;max-width:560px;margin:0 auto;
  display:flex;flex-direction:column;
  padding:
    calc(max(10px,env(safe-area-inset-top)) + var(--tg-content-safe-area-inset-top,0px))
    var(--pad)
    calc(max(14px,env(safe-area-inset-bottom)) + var(--tg-safe-area-inset-bottom,0px));
}

/* ---------- Верхняя панель ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px;flex:none}
.top-left{display:flex;align-items:center;gap:10px;min-width:0}
.back{
  display:none;place-items:center;width:38px;height:38px;flex:none;border-radius:12px;
  border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer;
}
.back svg{width:18px;height:18px}
.app[data-screen="create"] .back,.app[data-screen="offer"] .back{display:grid}
.tg-line{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:800;letter-spacing:.2em;white-space:nowrap}
.tg-check{width:17px;height:17px;flex:none}
.lang{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px;flex:none}
.lang button{
  border:0;background:transparent;color:var(--muted);font-weight:700;font-size:12px;
  padding:7px 12px;border-radius:999px;cursor:pointer;letter-spacing:.06em;transition:.2s
}
.lang button.active{background:var(--accent);color:var(--ink);box-shadow:0 4px 14px rgba(47,214,123,.35)}

/* ---------- Экраны ---------- */
.screen{display:none;flex:1;min-height:0;flex-direction:column}
.screen.active{display:flex;animation:screenIn .4s ease both}
@keyframes screenIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- Кнопки ---------- */
.btn{
  width:100%;border:0;border-radius:18px;cursor:pointer;
  min-height:clamp(54px,7.4dvh,68px);padding:0 18px;
  background:linear-gradient(180deg,var(--accent) 0%,var(--accent2) 100%);
  color:var(--ink);font-weight:900;font-size:clamp(15px,4.2vw,18px);letter-spacing:.1em;
  box-shadow:0 12px 30px rgba(47,214,123,.28);
  display:flex;align-items:center;justify-content:center;gap:10px;
  transition:transform .12s,opacity .2s,box-shadow .2s;
}
.btn:active{transform:scale(.985)}
.btn:disabled{opacity:.55;cursor:not-allowed;box-shadow:none}
.btn-ghost{
  background:transparent;color:var(--text);box-shadow:none;border:1px solid var(--line);
  min-height:clamp(46px,6.2dvh,56px);font-size:clamp(13px,3.6vw,15px);letter-spacing:.04em;font-weight:700
}
.spinner{width:18px;height:18px;border:2px solid rgba(4,33,15,.3);border-top-color:var(--ink);border-radius:50%;animation:spin .7s linear infinite;display:none}
.btn.loading .spinner{display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Символ обмена (анимированные стрелки) ---------- */
.swap{position:relative;display:grid;place-items:center;aspect-ratio:1/1;width:100%}
.swap::before{
  content:"";position:absolute;inset:6%;border-radius:50%;
  background:radial-gradient(circle,rgba(47,214,123,.28) 0%,rgba(47,214,123,0) 70%);
  animation:glow 2.4s ease-in-out infinite;
}
.swap svg{position:relative;width:78%;height:78%;overflow:visible}
.swap path{fill:none;stroke:var(--accent);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.swap .arr-r{animation:slideR 2s ease-in-out infinite}
.swap .arr-l{animation:slideL 2s ease-in-out infinite}
@keyframes slideR{0%,100%{transform:translateX(-3px);opacity:.55}50%{transform:translateX(3px);opacity:1}}
@keyframes slideL{0%,100%{transform:translateX(3px);opacity:.55}50%{transform:translateX(-3px);opacity:1}}
@keyframes glow{0%,100%{transform:scale(.85);opacity:.6}50%{transform:scale(1.1);opacity:1}}

/* ---------- Главный экран ---------- */
.home-main{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;
  gap:clamp(12px,2.2dvh,24px);padding:clamp(6px,1.4dvh,16px) 0;
}
.hero{
  position:relative;container-type:size;aspect-ratio:1/1;flex:none;
  width:min(100%,480px,max(220px,calc(var(--app-h) - 345px)));
  border-radius:clamp(24px,7.5vw,36px);
  background:
    radial-gradient(120% 90% at 50% 0%,rgba(47,214,123,.2) 0%,rgba(47,214,123,0) 60%),
    linear-gradient(180deg,#171c27 0%,#0f131b 100%);
  border:1px solid var(--line);
  box-shadow:0 24px 70px rgba(47,214,123,.12),inset 0 1px 0 rgba(255,255,255,.04);
  overflow:hidden;
}
.hero-in{position:absolute;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding:20px;padding:clamp(14px,6cqw,28px)}
.hero-label{
  display:flex;align-items:center;justify-content:center;gap:8px;
  font-size:11px;font-size:clamp(10px,3.4cqw,15px);font-weight:900;letter-spacing:.26em;color:var(--text)
}
.hero-label::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);animation:pulse 1.8s ease-in-out infinite}
.hero-mid{
  display:grid;grid-template-columns:minmax(0,1fr) 16cqw minmax(0,1fr);align-items:center;column-gap:2cqw
}
.deco{
  position:relative;width:100%;aspect-ratio:1/1;border-radius:18%;overflow:hidden;
  border:1px solid rgba(255,255,255,.08);box-shadow:0 14px 34px rgba(0,0,0,.45);
}
.deco svg{position:absolute;inset:0;width:100%;height:100%}
.deco-a{background:linear-gradient(145deg,#1f9d63 0%,#0e4f35 100%);animation:floatA 5s ease-in-out infinite}
.deco-b{background:linear-gradient(145deg,#5b5bd6 0%,#27235f 100%);animation:floatB 5s ease-in-out infinite}
@keyframes floatA{0%,100%{transform:translateY(-2.5%)}50%{transform:translateY(2.5%)}}
@keyframes floatB{0%,100%{transform:translateY(2.5%)}50%{transform:translateY(-2.5%)}}
.hero-foot{text-align:center;font-size:11px;font-size:clamp(10px,3cqw,13px);color:var(--muted);letter-spacing:.06em}

.title{margin:0;text-align:center;font-weight:900;letter-spacing:.06em;font-size:clamp(26px,8.2vw,40px);line-height:1.05}
.title .accent{color:var(--accent)}
.desc{margin:0;text-align:center;color:var(--muted);font-size:clamp(14px,3.9vw,17px);line-height:1.45;max-width:34ch}
.home-cta{width:100%;flex:none}

/* ---------- Создание сделки ---------- */
.create-main{flex:1;display:flex;flex-direction:column;gap:clamp(10px,1.8dvh,16px);padding-top:clamp(6px,1dvh,12px)}
.create-title{margin:2px 0 0;font-size:clamp(21px,6.2vw,27px);font-weight:900;letter-spacing:.02em}
.block{
  flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;gap:clamp(10px,1.8dvh,16px);
  background:linear-gradient(180deg,var(--card) 0%,var(--bg2) 100%);
  border:1px solid var(--line);border-radius:20px;padding:clamp(14px,2.6dvh,22px);
  transition:border-color .2s;
}
.block:focus-within{border-color:rgba(47,214,123,.45)}
.block-head{display:flex;align-items:center;gap:10px}
.block-num{
  width:28px;height:28px;border-radius:9px;display:grid;place-items:center;
  background:rgba(47,214,123,.14);color:var(--accent);font-weight:900;font-size:13px
}
.block h2{margin:0;font-size:clamp(12px,3.4vw,14px);font-weight:900;letter-spacing:.14em;text-transform:uppercase}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
.field input{
  width:100%;background:var(--card2);border:1px solid var(--line);color:var(--text);
  border-radius:14px;padding:clamp(13px,2.1dvh,17px) 14px;font-size:16px;font-weight:500;outline:none;
  transition:border-color .2s,box-shadow .2s;
}
.field input::placeholder{color:#566076}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,214,123,.16)}
.field.invalid input{border-color:var(--danger);box-shadow:0 0 0 3px rgba(255,93,108,.12)}
.err{display:none;color:var(--danger);font-size:12px;margin-top:6px;line-height:1.35}
.field.invalid .err{display:block}
.status{display:none;padding:11px 14px;border-radius:12px;font-size:13px;line-height:1.4;border:1px solid var(--line);background:var(--card)}
.status.show{display:block}
.status.error{color:#ffb3bb;border-color:rgba(255,93,108,.4);background:rgba(255,93,108,.08)}
.status.info{color:var(--muted)}

/* ---------- Карточка предложения ---------- */
.offer-main{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;
  gap:clamp(10px,1.8dvh,18px);padding:clamp(6px,1.2dvh,14px) 0;min-height:0
}
.offer-wrap{width:min(100%,560px,max(260px,calc(var(--app-h) - 260px)));flex:none}
.offer-card{
  position:relative;container-type:size;width:100%;aspect-ratio:1/1;overflow:hidden;
  border-radius:clamp(24px,7.5vw,36px);
  background:
    radial-gradient(120% 80% at 50% 0%,rgba(47,214,123,.16) 0%,rgba(47,214,123,0) 58%),
    linear-gradient(180deg,#171c27 0%,#0f131b 100%);
  border:1px solid var(--line);
  box-shadow:0 24px 70px rgba(47,214,123,.1),inset 0 1px 0 rgba(255,255,255,.04);
  transition:filter .4s,border-color .4s;
}
.offer-in{
  position:absolute;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;
  padding:16px;padding:clamp(12px,5.5cqw,26px);
  gap:8px;gap:clamp(6px,2.4cqw,14px);
}
.offer-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.offer-title{font-size:12px;font-size:clamp(11px,3.6cqw,16px);font-weight:900;letter-spacing:.22em}
.pill{
  display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;
  font-size:10px;font-size:clamp(9px,2.9cqw,12px);font-weight:900;letter-spacing:.12em;
  background:rgba(47,214,123,.12);color:var(--accent);border:1px solid rgba(47,214,123,.32);
}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 1.6s ease-in-out infinite}
.offer-card.expired .pill{background:rgba(255,93,108,.12);color:var(--danger);border-color:rgba(255,93,108,.35)}
.offer-card.expired .pill::before{animation:none}
@keyframes pulse{0%,100%{opacity:.4;transform:scale(.85)}50%{opacity:1;transform:scale(1.15)}}

.offer-mid{
  display:grid;grid-template-columns:minmax(0,1fr) clamp(28px,12cqw,60px) minmax(0,1fr);
  align-items:center;column-gap:clamp(4px,1.6cqw,10px);min-height:0
}
.offer-nft{margin:0;min-width:0}
.slot{
  position:relative;width:100%;aspect-ratio:1/1;overflow:hidden;
  border-radius:14px;border-radius:clamp(10px,5cqw,20px);
  background:var(--card2);border:1px solid var(--line);
  transition:filter .4s;
}
.offer-card.expired .slot{filter:grayscale(.85) brightness(.7)}
.slot img{width:100%;height:100%;object-fit:contain;display:block;opacity:0;transition:opacity .45s ease}
.slot img.ready{opacity:1}
.slot img.hide{opacity:0!important}
.skeleton{position:absolute;inset:0;background:linear-gradient(100deg,var(--card2) 30%,#242b3d 50%,var(--card2) 70%);background-size:200% 100%;animation:shimmer 1.2s linear infinite}
@keyframes shimmer{to{background-position:-200% 0}}
.slot-fail{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:8px;color:var(--danger);font-size:11px}
.slot.failed .slot-fail{display:flex}
.slot.failed .skeleton{display:none}
/* Оригинальная анимация: плавное появление поверх статичного превью */
.slot-media{position:absolute;inset:0;display:none;align-items:center;justify-content:center;opacity:0;transition:opacity .45s ease}
.slot-media.pending{display:flex;visibility:hidden}
.slot-media.on{display:flex;visibility:visible;opacity:1}
.slot-media>*{width:100%;height:100%;display:block;object-fit:contain}
.slot.live::after{
  content:"";position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;
  background:var(--accent);box-shadow:0 0 8px var(--accent);z-index:2
}
.cap{margin-top:5px;margin-top:clamp(4px,1.6cqw,8px);text-align:center;min-width:0}
.cap b{display:block;font-size:11px;font-size:clamp(10px,3cqw,14px);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cap span{display:block;font-size:10px;font-size:clamp(9px,2.7cqw,12px);color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.offer-bottom{display:flex;flex-direction:column;align-items:center;gap:6px;gap:clamp(4px,1.6cqw,8px);text-align:center;min-width:0}
.offer-sentence{
  margin:0;font-size:12px;font-size:clamp(11px,3.5cqw,17px);line-height:1.35;font-weight:600;
  display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;
}
.timer-line{margin:0;display:flex;align-items:baseline;justify-content:center;flex-wrap:wrap;gap:.45em;font-variant-numeric:tabular-nums}
.timer-label{font-size:11px;font-size:clamp(10px,3.2cqw,15px);color:var(--muted)}
.timer-time{font-size:16px;font-size:clamp(15px,5.8cqw,27px);font-weight:900;color:var(--accent);letter-spacing:.04em}
.offer-card.expired .timer-label{color:var(--danger);font-weight:700}

.offer-notes{width:100%;font-size:12px;line-height:1.4;color:var(--muted);text-align:center}
.offer-notes div+div{margin-top:3px}
.offer-actions{width:100%;display:flex;flex-direction:column;gap:10px;flex:none}

.offer-error{
  display:none;width:100%;max-width:420px;text-align:center;flex-direction:column;align-items:center;gap:14px;
  background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px 20px
}
.offer-error.show{display:flex}
.offer-error p{margin:0;color:#ffb3bb;font-size:15px;line-height:1.45}

@media (prefers-reduced-motion:reduce){
  .swap::before,.swap .arr-r,.swap .arr-l,.deco-a,.deco-b,.hero-label::before,.pill::before{animation:none}
}
</style>
</head>
<body>
<div class="app" id="appRoot" data-screen="home">

  <header class="top">
    <div class="top-left">
      <button type="button" class="back" id="backBtn" aria-label="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="tg-line">
        <span>TELEGRAM</span>
        <svg class="tg-check" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="11" fill="#2a9df4"/>
          <path d="M7 12.5l3.2 3.2L17 9" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" id="langRu" data-lang="ru">RU</button>
      <button type="button" id="langEn" data-lang="en">EN</button>
    </div>
  </header>

  <!-- ================= ГЛАВНЫЙ ЭКРАН ================= -->
  <main class="screen active" id="screenHome">
    <div class="home-main">
      <div class="hero" aria-hidden="true">
        <div class="hero-in">
          <div class="hero-label">NFT EXCHANGE</div>
          <div class="hero-mid">
            <div class="deco deco-a">
              <svg viewBox="0 0 100 100"><path d="M50 18l24 32-24 32-24-32z" fill="rgba(255,255,255,.16)"/><path d="M50 30l14 20-14 20-14-20z" fill="rgba(255,255,255,.28)"/></svg>
            </div>
            <div class="swap">
              <svg viewBox="0 0 48 48">
                <g class="arr-r"><path d="M8 17h28M29 10l7 7-7 7"/></g>
                <g class="arr-l"><path d="M40 31H12M19 24l-7 7 7 7"/></g>
              </svg>
            </div>
            <div class="deco deco-b">
              <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="28" fill="rgba(255,255,255,.14)"/><circle cx="50" cy="50" r="15" fill="rgba(255,255,255,.28)"/></svg>
            </div>
          </div>
          <div class="hero-foot" data-i18n="heroFoot">Telegram NFT · 1 на 1</div>
        </div>
      </div>

      <div style="display:flex;flex-direction:column;align-items:center;gap:clamp(8px,1.4dvh,14px)">
        <h1 class="title">ONE TAP <span class="accent">TRADE</span></h1>
        <p class="desc" data-i18n="homeDesc">Обменивайтесь Telegram NFT один на один: создайте предложение и отправьте его партнёру.</p>
      </div>

      <button type="button" class="btn home-cta" id="createDealBtn" data-i18n="createDeal">СОЗДАТЬ СДЕЛКУ</button>
    </div>
  </main>

  <!-- ================= СОЗДАНИЕ СДЕЛКИ ================= -->
  <main class="screen" id="screenCreate">
    <div class="create-main">
      <h2 class="create-title" data-i18n="createTitle">Новая сделка</h2>

      <section class="block">
        <div class="block-head"><span class="block-num">1</span><h2 data-i18n="yourNft">ВАШ NFT</h2></div>
        <div class="field" id="myUsernameField">
          <label for="myUsername" data-i18n="yourUsername">Ваш Telegram username</label>
          <input id="myUsername" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="@username">
          <div class="err" id="myUsernameErr"></div>
        </div>
        <div class="field" id="myNftLinkField">
          <label for="myNftLink" data-i18n="nftLink">Ссылка на NFT</label>
          <input id="myNftLink" type="text" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="t.me/nft/BDayCandle-202879">
          <div class="err" id="myNftLinkErr"></div>
        </div>
      </section>

      <section class="block">
        <div class="block-head"><span class="block-num">2</span><h2 data-i18n="partnerNft">NFT ПАРТНЁРА</h2></div>
        <div class="field" id="partnerUsernameField">
          <label for="partnerUsername" data-i18n="partnerUsername">Telegram username партнёра</label>
          <input id="partnerUsername" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="@username">
          <div class="err" id="partnerUsernameErr"></div>
        </div>
        <div class="field" id="partnerNftLinkField">
          <label for="partnerNftLink" data-i18n="nftLink">Ссылка на NFT</label>
          <input id="partnerNftLink" type="text" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="t.me/nft/ViceCream-313219">
          <div class="err" id="partnerNftLinkErr"></div>
        </div>
      </section>

      <div class="status" id="createStatus" role="status" aria-live="polite"></div>

      <button type="button" class="btn" id="confirmBtn">
        <span class="spinner" aria-hidden="true"></span>
        <span id="confirmBtnText" data-i18n="confirm">ПОДТВЕРДИТЬ</span>
      </button>
    </div>
  </main>

  <!-- ================= ПРЕДЛОЖЕНИЕ ================= -->
  <main class="screen" id="screenOffer">
    <div class="offer-main">

      <div class="offer-wrap" id="offerWrap">
        <article class="offer-card" id="offerCard">
          <div class="offer-in">
            <div class="offer-top">
              <span class="offer-title" data-i18n="offerTitle">ПРЕДЛОЖЕНИЕ</span>
              <span class="pill" id="offerStatus"></span>
            </div>

            <div class="offer-mid">
              <figure class="offer-nft">
                <div class="slot" id="n1Slot">
                  <div class="skeleton" id="n1Sk"></div>
                  <img id="n1Img" alt="">
                  <div class="slot-media" id="n1Media"></div>
                  <div class="slot-fail" id="n1Fail"></div>
                </div>
                <figcaption class="cap"><b id="n1Name"></b><span id="n1User"></span></figcaption>
              </figure>

              <div class="swap" aria-hidden="true">
                <svg viewBox="0 0 48 48">
                  <g class="arr-r"><path d="M8 17h28M29 10l7 7-7 7"/></g>
                  <g class="arr-l"><path d="M40 31H12M19 24l-7 7 7 7"/></g>
                </svg>
              </div>

              <figure class="offer-nft">
                <div class="slot" id="n2Slot">
                  <div class="skeleton" id="n2Sk"></div>
                  <img id="n2Img" alt="">
                  <div class="slot-media" id="n2Media"></div>
                  <div class="slot-fail" id="n2Fail"></div>
                </div>
                <figcaption class="cap"><b id="n2Name"></b><span id="n2User"></span></figcaption>
              </figure>
            </div>

            <div class="offer-bottom">
              <p class="offer-sentence" id="offerSentence"></p>
              <p class="timer-line"><span class="timer-label" id="offerTimerLabel"></span><span class="timer-time" id="offerTime"></span></p>
            </div>
          </div>
        </article>
      </div>

      <div class="offer-error" id="offerError">
        <p id="offerErrorText"></p>
        <button type="button" class="btn btn-ghost" id="offerErrorBtn" data-i18n="toHome">На главную</button>
      </div>

      <div class="offer-notes" id="offerNotes"></div>

      <div class="offer-actions" id="offerActions">
        <button type="button" class="btn" id="shareBtn" data-i18n="share">ПОДЕЛИТЬСЯ</button>
        <button type="button" class="btn btn-ghost" id="newDealBtn" data-i18n="newDeal">Создать новую сделку</button>
      </div>
    </div>
  </main>

</div>

<script src="app.js"></script>
</body>
